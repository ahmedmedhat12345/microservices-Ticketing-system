apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      containers:
      - name: reporting-service
        image: reporting-image:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: reporting-pvc
