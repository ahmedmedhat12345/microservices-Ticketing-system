apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-service
  template:
    metadata:
      labels:
        app: support-service
    spec:
      containers:
      - name: support-service
        image: support-image:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: support-pvc
